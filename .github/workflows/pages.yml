name: Build and deploy website

on:
  push:
    branches:
      - main

  workflow_dispatch:

  repository_dispatch:
    types:
      - microcms_update

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Astro website
        run: npm run build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          MICROCMS_INFORMATION_ENDPOINT: ${{ secrets.MICROCMS_INFORMATION_ENDPOINT }}
          MICROCMS_CONCERTS_ENDPOINT: ${{ secrets.MICROCMS_CONCERTS_ENDPOINT }}
          MICROCMS_MEMBERS_ENDPOINT: ${{ secrets.MICROCMS_MEMBERS_ENDPOINT }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
